<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Handwriting Capture</title>
<link rel="stylesheet" href="capture.css">
</head>
<body>
<header>
  <div class="row">
    <label>Section
      <select id="section"></select>
    </label>
    <span id="progress" aria-live="polite"></span>
    <span class="spacer"></span>
    <label>Size <input id="size" type="range" min="28" max="90" step="2" value="48"> <output id="sizeout"></output></label>
    <span id="penstat" title="Hover or press with the pen: shows what the browser sees and how hard you press">
      <span id="pentype">pen: waiting</span>
      <meter id="pmeter" min="0" max="1" value="0"></meter>
      <output id="pval">-</output>
    </span>
    <label class="check" title="Ignore a finger on the screen. Leave off if your tablet reports its pen as touch."><input id="penonly" type="checkbox"> Ignore finger touch</label>
  </div>
  <div id="prompt" aria-live="polite"></div>
  <div id="note"></div>
</header>
<main>
  <canvas id="pad"></canvas>
  <footer>
    <button id="prev">Back</button>
    <button id="undo">Undo stroke</button>
    <button id="clear">Clear</button>
    <span id="msg" role="status"></span>
    <span class="spacer"></span>
    <button id="skip">Skip</button>
    <button id="save" class="primary">Save &amp; next</button>
  </footer>
</main>
<script src="capture.js"></script>
</body>
</html>
